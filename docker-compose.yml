services:
  postgres:
    image: postgres:16-alpine
    container_name: ideaforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ideaforge}
      POSTGRES_USER: ${POSTGRES_USER:-ideaforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ideaforge} -d ${POSTGRES_DB:-ideaforge}"]
      interval: 10s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:0.5.23
    container_name: ideaforge-chroma
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  backend:
    build:
      context: ./support/backend
    container_name: ideaforge-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ideaforge}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-ideaforge}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      BACKEND_CORS_ORIGINS: '["http://localhost:5173"]'
      UPLOAD_DIRECTORY: uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-30}
    ports:
      - "8000:8000"
    volumes:
      - ./support/backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started

  frontend:
    build:
      context: ./support/frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: ideaforge-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ideaforge-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@ideaforge.ai}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  chroma_data:
  pgadmin_data: